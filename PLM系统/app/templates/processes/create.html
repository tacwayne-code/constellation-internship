{% extends "base.html" %}

{% block title %}PLM - 新建工艺路线{% endblock %}

{% block page_header %}
<h5 class="mb-0"><i class="bi bi-plus-circle me-2"></i>新建工艺路线</h5>
{% endblock %}

{% block content %}
<div class="card">
    <div class="card-body">
        <form method="POST" action="#" id="processForm">
            <div class="row g-3 mb-4">
                <div class="col-md-6">
                    <label class="form-label">工艺名称 <span class="text-danger">*</span></label>
                    <input type="text" name="name" class="form-control" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label">关联产品 <span class="text-danger">*</span></label>
                    <select name="product_id" class="form-select" required>
                        <option value="">-- 选择产品 --</option>
                        {% for p in products %}
                        <option value="{{ p.id }}">{{ p.name }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-12">
                    <label class="form-label">描述</label>
                    <textarea name="description" class="form-control" rows="3"></textarea>
                </div>
            </div>

            <hr class="my-4">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h6 class="mb-0"><i class="bi bi-list-ol me-1"></i>工艺步骤</h6>
                <button type="button" class="btn btn-outline-primary btn-sm" onclick="addStep()">
                    <i class="bi bi-plus-lg me-1"></i>添加步骤
                </button>
            </div>

            <div class="table-responsive">
                <table class="table table-bordered" id="stepsTable">
                    <thead class="table-light">
                        <tr>
                            <th style="width:50px">序号</th>
                            <th>步骤名称</th>
                            <th>标准工时</th>
                            <th>工作中心</th>
                            <th style="width:80px">操作</th>
                        </tr>
                    </thead>
                    <tbody id="stepsBody">
                        <tr>
                            <td class="text-center step-index">1</td>
                            <td><input type="text" name="step_name[]" class="form-control" required></td>
                            <td><input type="number" step="0.01" name="step_hours[]" class="form-control"></td>
                            <td><input type="text" name="step_center[]" class="form-control"></td>
                            <td class="text-center">
                                <button type="button" class="btn btn-outline-danger btn-sm" onclick="removeStep(this)" disabled>
                                    <i class="bi bi-trash"></i>
                                </button>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <div class="d-flex justify-content-end gap-2 mt-3">
                <a href="#" class="btn btn-secondary">取消</a>
                <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg me-1"></i>创建工艺路线</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}

{% block content_scripts %}
<script>
function addStep() {
    const tbody = document.getElementById('stepsBody');
    const rows = tbody.querySelectorAll('tr');
    const index = rows.length + 1;
    const tr = document.createElement('tr');
    tr.innerHTML = `
        <td class="text-center step-index">${index}</td>
        <td><input type="text" name="step_name[]" class="form-control" required></td>
        <td><input type="number" step="0.01" name="step_hours[]" class="form-control"></td>
        <td><input type="text" name="step_center[]" class="form-control"></td>
        <td class="text-center">
            <button type="button" class="btn btn-outline-danger btn-sm" onclick="removeStep(this)">
                <i class="bi bi-trash"></i>
            </button>
        </td>
    `;
    tbody.appendChild(tr);
    reindex();
}

function removeStep(btn) {
    if (document.getElementById('stepsBody').querySelectorAll('tr').length <= 1) return;
    btn.closest('tr').remove();
    reindex();
}

function reindex() {
    const rows = document.getElementById('stepsBody').querySelectorAll('tr');
    rows.forEach((row, i) => {
        row.querySelector('.step-index').textContent = i + 1;
    });
}
</script>
{% endblock %}
