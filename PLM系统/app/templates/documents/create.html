{% extends "base.html" %}

{% block title %}新建文档 - PLM 系统{% endblock %}

{% block page_header %}
<h5 class="mb-0"><i class="bi bi-plus-circle me-2"></i>新建文档</h5>
{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="card">
            <div class="card-body p-4">
                <form method="POST" action="{{ url_for('documents.create_doc') }}" enctype="multipart/form-data">
                    <div class="mb-3">
                        <label for="title" class="form-label">标题 <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" id="title" name="title" placeholder="请输入文档标题" required>
                    </div>

                    <div class="mb-3">
                        <label for="description" class="form-label">描述</label>
                        <textarea class="form-control" id="description" name="description" rows="4" placeholder="请输入文档描述"></textarea>
                    </div>

                    <div class="mb-3">
                        <label for="category_id" class="form-label">分类</label>
                        <select class="form-select" id="category_id" name="category_id">
                            <option value="">请选择分类</option>
                            {% for cat in categories %}
                            <option value="{{ cat.id }}">{{ cat.name }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="mb-3">
                        <label for="tags" class="form-label">标签</label>
                        <input type="text" class="form-control" id="tags" name="tags" placeholder="多个标签请用逗号分隔">
                        <div class="form-text">多个标签请用逗号分隔</div>
                    </div>

                    <div class="mb-4">
                        <label for="file" class="form-label">上传文件</label>
                        <input class="form-control" type="file" id="file" name="file">
                        <div class="form-text">支持 PDF、DWG、DXF、STEP、Office 文档、图片等格式</div>
                    </div>

                    <div class="d-flex justify-content-between">
                        <a href="{{ url_for('documents.list_docs') }}" class="btn btn-outline-secondary">
                            <i class="bi bi-arrow-left me-1"></i>返回
                        </a>
                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-check-lg me-1"></i>创建文档
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
