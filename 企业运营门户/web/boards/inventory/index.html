<!doctype html>
<html lang="zh-CN">
  <head>
    <link rel="stylesheet" href="/shared.css" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>采购与库存</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%2307111f'/%3E%3Cpath d='M12 44 28 14l24 36H18' fill='none' stroke='%2338bdf8' stroke-width='5' stroke-linejoin='round'/%3E%3Cpath d='M29 31h10M29 41h18' stroke='%2322c55e' stroke-width='5' stroke-linecap='round'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="./styles.css?v=51" />
  </head>
  <body data-board="inventory">
    <script src="/shared.js"></script>
    <main class="risk-shell">
      <header class="command-bar">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true"></span>
          <div>
            <h1>采购与库存</h1>
            <p>基于 Odoo ERP 数据汇总采购、库存、供应商和收货异常，只读展示，不写回 ERP。</p>
          </div>
        </div>

        <nav class="screen-tabs" aria-label="驾驶舱切换">
          <button class="tab active" data-screen="purchase" type="button">采购异常</button>
          <button class="tab" data-screen="inventory" type="button">库存异常</button>
        </nav>

        <div class="toolbar">
          <label class="filter-control">
            <span>等级</span>
            <select id="levelFilter" aria-label="筛选风险等级">
              <option value="all">全部异常</option>
              <option value="P0">P0 今天必须处理</option>
              <option value="P1">P1 3 天内处理</option>
              <option value="P2">P2 本周关注</option>
              <option value="P3">P3 普通提醒</option>
            </select>
          </label>
          <label class="search-control">
            <span>搜索</span>
            <input id="riskSearch" autocomplete="off" placeholder="产品 / 物料 / 供应商 / 单号" />
          </label>
          <button class="tool-button" id="refreshBtn" type="button" title="刷新数据">刷新</button>
          
          <button class="icon-button" id="fullscreenBtn" type="button" title="全屏显示" aria-label="全屏显示">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" />
            </svg>
          </button>
        </div>
      </header>

      <section class="status-strip" aria-label="数据状态">
        <span class="live-dot" id="connectionDot"></span>
        <span id="connectionStatus">正在连接 Odoo ERP</span>
        <span id="refreshMeta">等待刷新</span>
        <span id="dataCoverage">数据覆盖：等待同步</span>
        <span id="clock">--:--:--</span>
      </section>

      <section class="dashboard-view active" id="purchaseView" aria-label="采购异常看板">
        <div id="purchaseLayout" class="dashboard-layout"></div>
      </section>

      <section class="dashboard-view" id="inventoryView" aria-label="库存异常看板">
        <div id="inventoryLayout" class="dashboard-layout"></div>
      </section>
    </main>

    <script src="./app.js?v=51"></script>
  </body>
</html>
