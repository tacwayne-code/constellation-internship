services:
  identity:
    build: .
    image: constellation/identity:local
    container_name: constellation-identity
    restart: unless-stopped
    env_file:
      - /opt/constellation/secrets/identity.env
    environment:
      IDENTITY_HOST: 0.0.0.0
      IDENTITY_PORT: "8010"
      IDENTITY_DB: /data/identity.db
    ports:
      - "127.0.0.1:8010:8010"
    volumes:
      - /opt/constellation/data/identity:/data
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
