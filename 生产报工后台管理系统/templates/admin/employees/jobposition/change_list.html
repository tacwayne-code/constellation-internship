{% extends "admin/change_list.html" %}
{% load i18n static %}

{% block extrastyle %}
  {{ block.super }}
  <style>
    body.model-jobposition #content,
    body.model-jobposition #content-main,
    body.model-jobposition #changelist,
    body.model-jobposition #changelist-form,
    body.model-jobposition #changelist-form .results {
      width: 100% !important;
      max-width: none !important;
      min-width: 0;
      box-sizing: border-box;
    }
    /* The custom delete button renders in the content flow (not in object-tools,
       which SimpleUI relocates into its top action bar). This keeps its click
       handler attached so selecting rows and clicking "删除" actually submits. */
    .jobposition-bulk-toolbar {
      text-align: left;
      margin: 0 0 12px;
    }
    .jobposition-bulk-toolbar a.deletelink {
      display: inline-block;
      padding: 7px 14px;
      color: #f56c6c;
      background-color: #ffffff;
      border: 1px solid #dcdfe6;
      border-radius: 4px;
      text-decoration: none;
      font-size: 14px;
      line-height: 1;
    }
    .jobposition-bulk-toolbar a.deletelink:hover {
      color: #ffffff;
      background-color: #f56c6c;
      border-color: #f56c6c;
    }
  </style>
{% endblock %}

{% block result_list %}
  <div class="jobposition-bulk-toolbar">
    <a href="#" id="delete-selected-positions" class="deletelink">删除</a>
  </div>
  {{ block.super }}
{% endblock %}

{% block footer %}
  {{ block.super }}
  <form id="position-delete-form" method="post" action="{% url 'admin:employees_jobposition_delete_selected' %}" style="display: none;">
    {% csrf_token %}
  </form>
  <script>
    (function () {
      var button = document.getElementById('delete-selected-positions');
      var form = document.getElementById('position-delete-form');
      if (!button || !form) return;
      button.addEventListener('click', function (event) {
        event.preventDefault();
        form.querySelectorAll('input[name="position_ids"]').forEach(function (input) { input.remove(); });
        var selected = document.querySelectorAll(
          '#result_list input[name="_selected_action"]:checked'
        );
        if (!selected.length) {
          window.alert('请先勾选需要删除的岗位。');
          return;
        }
        if (!window.confirm('确定删除选中的岗位及其相关工艺和授权吗？此操作不可撤销。')) return;
        selected.forEach(function (checkbox) {
          var input = document.createElement('input');
          input.type = 'hidden';
          input.name = 'position_ids';
          input.value = checkbox.value;
          form.appendChild(input);
        });
        form.submit();
      });
    }());
  </script>
{% endblock %}
