<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>真机 PLC 调试台</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f3f6fa;color:#14283f;font:16px/1.6 system-ui,sans-serif}main{max-width:1100px;margin:40px auto;padding:0 22px}h1{margin:0;font-size:30px}h2{font-size:19px;margin:0 0 14px}.muted{color:#617387}.bar{display:flex;justify-content:space-between;align-items:center;gap:16px}.badge{background:#e2eaf2;padding:7px 15px;border-radius:20px}.good{background:#d7f5e5;color:#09633d}.bad{background:#ffe4df;color:#a02616}.notice{padding:14px 18px;background:#e8f0ff;border-left:4px solid #326cdf;margin:24px 0}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.card,section{background:white;border:1px solid #dfe6ef;border-radius:12px;padding:22px}.card b{display:block;font-size:23px;margin-top:8px}section{margin:20px 0}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:12px;border-bottom:1px solid #e6ebf2}th{color:#617387;font-weight:500}pre{overflow:auto;font:13px/1.7 monospace;max-height:230px}button{border:1px solid #b9c9dc;background:white;color:#23466d;padding:9px 16px;border-radius:8px;cursor:pointer}#error{color:#a02616;overflow-wrap:anywhere}.stale{opacity:.5}@media(max-width:650px){main{margin:22px auto}.grid{grid-template-columns:1fr}.bar{align-items:flex-start}h1{font-size:23px}td,th{padding:9px 5px;font-size:14px}}</style></head>
<body><main data-control-permitted="__CONTROL_PERMITTED__"><div class="bar"><div><h1>真机 PLC 调试台</h1><div class="muted" id="mode-label">现场 S7 连接 · 权限核对中</div></div><span id="status" class="badge">连接中</span></div>
<div class="notice" id="access-notice">正在核对后台权限，控制入口默认关闭。</div>
<div class="grid"><div class="card">设备地址<b id="endpoint">—</b></div><div class="card">CPU / 程序状态<b id="cpu">—</b><span id="model" class="muted"></span></div><div class="card">设备反馈<b id="state">—</b><span id="alarm" class="muted">—</span></div></div>
<section><div class="bar"><h2>DB2 实时反馈</h2><button id="refresh">立即刷新</button></div><p class="muted" id="sample">等待首次采样</p><p id="error" role="alert"></p><table><thead><tr><th>地址</th><th>信号</th><th>值</th></tr></thead><tbody id="signals"></tbody></table><p class="muted">状态与报警按迁移交互表解释。轴位置、限位及安全互锁尚未采集。</p></section>
<section><h2>读取记录</h2><pre id="trace">等待数据</pre></section><p class="muted">采集间隔约 1 秒 · 自动重连 · 反馈超过 5 秒标记过期 · <a href="/docs">API 文档</a></p></main>
<script>const $=id=>document.getElementById(id);let controlAllowed=false;const pageAllowsControl=document.querySelector('main').dataset.controlPermitted==='true';function updateAccess(data){const serverAllows=data.mode==='PHYSICAL_CONTROL'&&data.task_dispatch_enabled===true;controlAllowed=pageAllowsControl&&serverAllows;const section=$('control-section');section.hidden=!controlAllowed;for(const input of section.querySelectorAll('input,select,button'))input.disabled=!controlAllowed;if(!controlAllowed)$('controlkey').value='';$('mode-label').textContent=controlAllowed?'现场 S7 连接 · 手动控制与实时反馈':serverAllows?'现场 S7 连接 · 只读配置待生效':'现场 S7 连接 · 只读监控';$('access-notice').textContent=controlAllowed?'通过控制区下发真机任务；动作结果以 PLC 反馈和现场设备为准。':serverAllows?'只读配置等待后台重启：旧后台仍为可写模式。当前页面已关闭全部控制入口。':data.mode==='PHYSICAL_READONLY'?'真机只读采集：监控 CPU 状态和 DB2 反馈，不发送任务、停止或其他 PLC 写入。':'正在核对后台权限，控制入口默认关闭。'}const plcStatusNames={1:'出库完成',2:'入库完成',3:'调仓完成',4:'移动完成',5:'取料完成',6:'放料完成',7:'异常',8:'空闲',9:'忙线',10:'复位完成'};let busy=false;async function refresh(){if(busy)return;busy=true;try{const r=await fetch('/api/state',{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);const d=await r.json();updateAccess(d);$('endpoint').textContent=d.endpoint;$('cpu').textContent=d.live?d.cpu_state:'未知 / 离线';$('model').textContent=[d.cpu_model,d.module_name].filter(Boolean).join(' · ');$('status').textContent=d.live?'真机已连接':'离线 / 反馈过期';$('status').className='badge '+(d.live?'good':'bad');const signals=d.signals||[];const val=i=>signals[i]?.value;$('state').textContent=d.live?(String(val(0)??'未知')+' · '+(plcStatusNames[val(0)]||'未知状态')):'未知';$('alarm').textContent=d.live?'报警码：'+(val(2)??'未知'):'报警状态未知';$('sample').textContent='采样 #'+d.sample+' · '+(d.updated_at?new Date(d.updated_at).toLocaleString():'尚未采样')+' · 数据年龄 '+(d.age_seconds??'—')+' 秒';$('error').textContent=d.last_error||'';$('signals').replaceChildren(...signals.map(s=>{const tr=document.createElement('tr');for(const v of [s.address,s.name,s.value]){const td=document.createElement('td');td.textContent=v;tr.append(td)}return tr}));$('signals').className=d.live?'':'stale';$('trace').textContent=(d.trace||[]).map(t=>t.time+'  DB'+t.db+' ['+t.offset+'..'+(t.offset+t.size-1)+']  '+t.hex).join('\n');$('commands').textContent=(d.commands||[]).map(c=>c.time+' '+c.action+' '+c.status+' '+c.detail).join('\n')||'尚未下发控制';$('permit').textContent=!d.live?'启动阻塞：PLC 反馈离线':val(0)!==8?'启动阻塞：当前为'+(plcStatusNames[val(0)]||'未知状态')+'（'+val(0)+'），下一任务需要空闲状态 8':val(2)!==0?'启动阻塞：报警码 '+val(2):val(3)!==1?'启动阻塞：PLC 远程接单许可未置位':'PLC 空闲且远程接单条件已置位';}catch(e){updateAccess({});$('status').textContent='服务连接中断';$('status').className='badge bad';$('cpu').textContent='未知 / 离线';$('state').textContent='未知';$('alarm').textContent='报警状态未知';$('signals').className='stale';$('error').textContent=e.message}finally{busy=false}}$('refresh').onclick=refresh;</script>
<template id="control-template"><section id="control-section" hidden><h2>真机手动控制</h2><p id="permit" class="muted"></p><label>控制密钥 <input id="controlkey" type="password" autocomplete="off" placeholder="从后台主机密钥文件复制"></label><p class="muted">后台文件：data/physical-control-key.txt。每台电脑打开或刷新页面后都需输入；密钥不会从另一台电脑同步。</p><button type="button" id="check-control">检查控制连接（不下发动作）</button><p id="connection-result" role="status" aria-live="polite"></p><form id="taskform"><div class="grid"><label>功能<select id="function"><option value="4">4 移动到目标</option><option value="1">1 出库</option><option value="2">2 入库</option><option value="3">3 调仓</option><option value="5">5 取箱到货叉</option><option value="6">6 放箱到目标</option></select></label><label>新任务号<input id="task_id" type="number" min="1" max="32767" required placeholder="1–32767，不能重复"></label><label>码头号<select id="dock"><option id="dock_zero" value="0">0（仅移动）</option><option selected>1</option><option>2</option></select></label></div><div class="grid" id="locations-form"></div><p><label><input type="checkbox" id="site_ready">已核对现场控制权、动作区域和目标库位，允许执行本次动作</label></p><button type="submit">核对并下发任务</button> <button type="button" id="stop" class="bad">发送停止命令</button><p class="muted">停止命令由原程序远程模式处理，不代替现场硬接线急停。启动条件不满足时不会写入任务。</p></form><p id="control-result" role="status"></p><pre id="commands"></pre></section></template>
<style>input,select{display:block;padding:9px;border:1px solid #bccbdd;border-radius:6px;max-width:100%;margin:6px 0 14px;font:inherit}input[type=checkbox]{display:inline}#locations-form{grid-template-columns:1fr 1fr;margin-top:20px}#control-result{overflow-wrap:anywhere}button:disabled{opacity:.5}@media(max-width:650px){#locations-form{grid-template-columns:1fr}}</style>
<script>document.querySelector('main').insertBefore($('control-template').content.cloneNode(true),document.querySelector('main section'));for(const [prefix,title] of [['source','取箱目标'],['target','放箱 / 移动目标']]){const box=document.createElement('div');const heading=document.createElement('h2');heading.textContent=title;box.append(heading);for(const [name,label,max] of [['side','左/右仓（1左，2右）',2],['level','层',32767],['column','列',32767],['depth','伸位（1单，2双）',2]]){const l=document.createElement('label');l.textContent=label;const input=document.createElement('input');input.id=prefix+'_'+name;input.type='number';input.min=1;input.max=max;input.required=true;input.placeholder='请输入现场值';l.append(input);box.append(l)}const zeroButton=document.createElement('button');zeroButton.type='button';zeroButton.id=prefix+'_zero';zeroButton.textContent='一键设为 0';zeroButton.hidden=true;zeroButton.onclick=()=>{for(const field of ['side','level','column','depth'])$(prefix+'_'+field).value='0'};box.append(zeroButton);const hint=document.createElement('p');hint.id=prefix+'_hint';hint.className='muted';hint.hidden=true;hint.textContent=prefix==='source'?'入库或移动时，取箱目标允许填 0；码头号单独选择。':'出库或移动时，放箱目标允许填 0；码头号单独选择。';box.append(hint);$('locations-form').append(box)}function updateTargetRules(){const fn=Number($('function').value);for(const prefix of ['source','target']){const zeroAllowed=fn===4||(prefix==='source'?fn===2:fn===1);for(const field of ['side','level','column','depth']){const input=$(prefix+'_'+field);input.min=zeroAllowed?'0':'1';input.placeholder=zeroAllowed?'可填 0 或现场值':'请输入现场值（至少 1）'}$(prefix+'_zero').hidden=!zeroAllowed;$(prefix+'_hint').hidden=!zeroAllowed}$('dock_zero').disabled=fn!==4;$('dock').setCustomValidity(fn!==4&&$('dock').value==='0'?'码头号仅在移动任务时允许为 0，请选择 1 或 2。':'')}$('function').addEventListener('change',updateTargetRules);$('dock').addEventListener('change',updateTargetRules);updateTargetRules();let sending=false;async function send(action){if(!controlAllowed){$('control-result').textContent='当前页面为只读，未发送控制请求';return}if(sending)return;if(!$('controlkey').value.trim()){$('control-result').textContent='请填写控制密钥';return}if(!$('site_ready').checked){$('control-result').textContent='请核对现场条件';return}const bytes=new Uint8Array(16);crypto.getRandomValues(bytes);const body={request_id:Array.from(bytes,x=>x.toString(16).padStart(2,'0')).join(''),action,site_ready:true};if(action==='task'){for(const id of ['task_id','function','dock','source_side','source_level','source_column','source_depth','target_side','target_level','target_column','target_depth'])body[id]=Number($(id).value);if(!confirm('向真机下发任务 '+body.task_id+'，功能 '+body.function+'\n取箱：'+[body.source_side,body.source_level,body.source_column,body.source_depth].join('/')+'\n放箱/移动：'+[body.target_side,body.target_level,body.target_column,body.target_depth].join('/')+'\n码头：'+body.dock+'\n确认执行？'))return;}sending=true;try{const r=await fetch('/api/physical/command',{method:'POST',headers:{'Content-Type':'application/json','X-Control-Key':$('controlkey').value.trim()},body:JSON.stringify(body)});const result=await r.json();$('control-result').textContent=r.ok?result.status+'：'+result.detail:JSON.stringify(result.detail);$('site_ready').checked=false;await refresh()}catch(e){$('control-result').textContent='请求结果未知，请核对PLC；不要重复下发。'+e.message}finally{sending=false}}async function checkControlConnection(){const result=$('connection-result');if(!controlAllowed){result.textContent='当前页面为只读，未发送控制请求';return}const key=$('controlkey').value.trim();if(!key){result.textContent='请在这台电脑上输入控制密钥，再检查连接。';return}const button=$('check-control');button.disabled=true;result.textContent='正在检查 '+location.origin+' …';try{const response=await fetch('/api/physical/command',{method:'POST',headers:{'Content-Type':'application/json','X-Control-Key':key},body:JSON.stringify({request_id:'connection-check-'+Date.now(),action:'task',task_id:0,site_ready:false})});const data=await response.json();if(response.status===409&&data.detail==='请确认现场控制权和动作区域已核对'){result.textContent='控制连接通过：这台电脑的请求已到达后台，密钥正确。此次检查未向 PLC 写入。'}else{result.textContent='控制连接检查未通过（HTTP '+response.status+'）：'+JSON.stringify(data.detail??data)}}catch(error){result.textContent='控制连接检查失败：'+error.message+'。请确认当前后台地址 '+location.origin+' 可以访问。'}finally{button.disabled=false}}$('check-control').onclick=checkControlConnection;$('taskform').onsubmit=e=>{e.preventDefault();send('task')};$('stop').onclick=()=>send('stop');updateAccess({});refresh();setInterval(refresh,1000);</script></body></html>
